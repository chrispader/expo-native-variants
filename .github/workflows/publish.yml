name: Publish package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag
        run: node -e "const version = require('./package.json').version; if ('v' + version !== process.env.RELEASE_TAG) throw new Error('Release tag does not match package version')"

      - name: Run package checks
        run: |
          bun run test
          bun run typecheck
          bun run typecheck:example
          bun run verify:package

      - name: Publish package
        run: npm publish --access public --tag "$NPM_DIST_TAG"
