name: Native build matrix

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  android:
    name: Android variants
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build config plugin
        run: bun run build

      - name: Generate Android project
        working-directory: example
        run: bun run prebuild --clean --platform android

      - name: Build Android matrix
        run: bun run build:native:android

      - name: Upload Android artifacts and logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-native-matrix
          path: |
            .artifacts/native/android
            .artifacts/native/logs/android
          if-no-files-found: ignore
          retention-days: 14

  ios:
    name: iOS variants
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Verify Xcode toolchain
        run: xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build config plugin
        run: bun run build

      - name: Generate iOS project
        working-directory: example
        run: bun run prebuild --clean --platform ios

      - name: Install CocoaPods dependencies
        working-directory: example/ios
        run: pod install

      - name: Build iOS matrix
        run: bun run build:native:ios

      - name: Upload iOS artifacts and logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-native-matrix
          path: |
            .artifacts/native/ios
            .artifacts/native/logs/ios
          if-no-files-found: ignore
          retention-days: 14
